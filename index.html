<!DOCTYPE html>
<html lang="en">
  <head><style>
  body {font-family: 'Playfair Display', serif;}
</style>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday Utik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>
  <body 
  style="
    background-image: url(https://images.unsplash.com/photo-1625507946701-dcaa2a4a6ed4?q=80&w=1170&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D);
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
  "
  class="flex justify-center h-screen items-center"
>
  >
    <div
      class="bg-white border px-10 py-8 border-4 border-gray-300 shadow-lg shadow-blue-300 rounded-xl text-center animate__animated animate__backInDown m-8 w-80"
      id="kartu"
    >
      <h1 class="text-3xl">Happy Birthday</h1>
      <h1
        class="text-4xl text-yellow-500 font-bold animate__animated animate__pulse animate__infinite"
      >
        Utik
      </h1>
      <button
        class="p-2 bg-yellow-600 text-white rounded mt-5 hover:bg-blue-900 transition ease-in w-full animate__animated animate__delay-1s animate__tada"
        onclick="ubahKartu()"
      >
        Klik Disini Utik!
      </button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@tsparticles/confetti@3.0.3/tsparticles.confetti.bundle.min.js"></script>
    <script>
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 },
      });
      let kartu = document.getElementById("kartu");
      function ubahKartu() {
        kartu.innerHTML = `    <h1 class="font-semibold text-wrap animate__animated animate__zoomIn">
      Selamat Ulang Tahun ke-22,<br>   Ni Wayan Putri Intan Maharani! Semoga utik selalu bahagia ya, semoga segala ketenangan yang utik harapkan akan terus selalu diusahakan oleh semesta, 
      semoga utik selalu bahagia, semoga utik lebih sukses, dan terakhir semoga hal-hal baik terus bersama utik. <i>Remember ya utik u already do ur best, keep it up, <br>and let GOD do the rest! 
      </i>
    <h2 class="mt-3 animate__animated animate__fadeIn">
      - Dari : William -
    </h2>
    <button
      class="p-2 bg-slate-600 text-white rounded mt-5 hover:bg-slate-900 transition ease-in w-full animate__animated animate__delay-1s animate__tada"
      onclick="refresh()"
    >
      Tutup
    </button>
    `;
      }
      function refresh() {
        location.reload();
      }
    </script>
  </body>
</html>
